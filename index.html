<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estofaria Amorelli · Gestão</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Amorelli"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#141414;--mut:#7a7a74;--line:#ebeae4;--gold:#f5b800;--ok:#15803d;--bad:#dc2626;--blue:#2563eb;--warn:#b45309;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.06);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e0e;--card:#1a1a1a;--ink:#f3f3f3;--mut:#9a9a94;--line:#2a2a2a;--sh:none}}
:root[data-theme=dark]{--bg:#0e0e0e;--card:#1a1a1a;--ink:#f3f3f3;--mut:#9a9a94;--line:#2a2a2a;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
#logo{height:46px;width:auto;flex:none}
.hd-t{flex:1;min-width:0}
.hd-t b{display:block;font-size:15px;letter-spacing:.2px}
.hd-t span{color:var(--mut);font-size:12px;text-transform:capitalize}
main{max-width:720px;margin:0 auto;padding:16px 14px 120px}
h2{font-size:22px;letter-spacing:-.3px;margin:4px 0 14px}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:0 0 12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.grid .card{margin:0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--gold)}
.kpi span{display:block;color:var(--mut);font-size:12.5px;font-weight:600}
.kpi b{display:block;font-size:20px;margin-top:6px;letter-spacing:-.3px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:10px 0 6px}
input,select{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,184,0,.25)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--gold);color:#111;cursor:pointer;transition:transform .1s,opacity .15s}
button:active{transform:scale(.97)}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
button.wa{background:#25d366;color:#fff}
button.danger{background:none;color:var(--bad);border:1px solid #f3d0cc;font-weight:600}
button.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.mut{color:var(--mut);font-size:13px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--mut)}
.c-pendente{background:#fef3c7;color:var(--warn)}
.c-aprovado,.c-aberta{background:#dbeafe;color:var(--blue)}
.c-concluida,.c-paga{background:#dcfce7;color:var(--ok)}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}
td{padding:8px 6px;border-bottom:1px solid var(--line)}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.tabbar button{flex:1;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:4px 0;border-radius:0}
.ic{width:46px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar .on{color:var(--ink)}
.tabbar .on .ic{background:var(--gold);color:#111}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal[hidden]{display:none}
.box{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.box:before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.on{opacity:1;transform:translateX(-50%)}
#st{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:2px}
.login{max-width:420px;margin:24px auto}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;left:0;top:0;width:100%;background:#fff;color:#000}}
</style>
</head>

function linha(d,k){
  const car=carDe(d),cli=cliDe(d);

  const v={inicio:vInicio,atend:vAtend,ordens:vOrdens,caixa:vCaixa,cad:vCad}[tab];

  <div class="card kpi"><span>Entradas hoje</span><b class="ok">${R(eH)}</b></div>
  <div class="card kpi"><span>Saídas hoje</span><b class="bad">${R(sH)}</b></div>
  <div class="card kpi"><span>Saldo do mês</span><b>${R(eM-sM)}</b></div>
  <div class="card kpi"><span>OS em aberto</span><b>${abertas.length}</b></div>
  <div class="card kpi"><span>Orçamentos pendentes</span><b>${pend.length}</b></div></div>
  <div class="card"><h3>OS em aberto</h3>${abertas.map(o=>linha(o,'oss')).join('')||'<p class="mut">Nenhuma OS em aberto.</p>'}</div>`;
}

/* ---------- Atendimento ---------- */
function vAtend(){
  const v=k=>esc(draft[k]??'');
  return `<h2>Atendimento</h2><section id="atend">
  <div class="card"><h3>Caminhão e cliente</h3>
  <label>Placa</label><input id="placa" list="dlc" value="${v('placa')}" placeholder="ABC1D23" autocomplete="off" style="text-transform:uppercase">
  <datalist id="dlc">${db.caminhoes.map(c=>`<option value="${esc(c.placa)}">`).join('')}</datalist>
  <div class="g">
    <div><label>Empresa / cliente</label><input id="cliente" value="${v('cliente')}"></div>
    <div><label>WhatsApp do cliente</label><input id="tel" inputmode="tel" value="${v('tel')}"></div>
    <div><label>Motorista</label><input id="motorista" value="${v('motorista')}"></div>
    <div><label>Modelo do caminhão</label><input id="modelo" value="${v('modelo')}"></div>
    <div><label>Cor</label><input id="cor" value="${v('cor')}"></div>
  </div></div>
  <div class="card"><h3>Itens</h3>
  <div class="g"><div style="grid-column:1/-1"><label>Item ou serviço</label><input id="desc" list="dlp" value="${v('desc')}" placeholder="Ex.: Reforma de banco" autocomplete="off">
    <datalist id="dlp">${db.produtos.map(p=>`<option value="${esc(p.nome)}">`).join('')}</datalist></div>
    <div><label>Qtd</label><input id="qtd" inputmode="numeric" value="${v('qtd')||'1'}"></div>
    <div><label>Preço</label><input id="preco" inputmode="decimal" value="${v('preco')}" placeholder="0,00"></div></div>
  <div class="acts"><button class="ghost" data-a="add">+ Adicionar item</button></div>
  <div style="margin-top:10px">${cart.map((i,n)=>`<div class="item"><span>${esc(i.desc)} · ${i.qtd}x</span><span>${R(i.qtd*i.preco)} <button class="sm danger" data-a="rem" data-id="${n}">×</button></span></div>`).join('')||'<p class="mut">Nenhum item adicionado.</p>'}
  <div class="item"><b>Total</b><b>${R(totalCart())}</b></div></div></div>
  <div class="card"><div class="acts" style="margin-top:0"><button data-a="orc">Gerar orçamento</button><button class="ghost" data-a="os">Abrir OS</button><button class="ghost" data-a="vender">Venda à vista</button></div></div>
  </section>`;
}
function achar(){
  const c=db.caminhoes.find(x=>x.placa===norm(draft.placa));
  if(!c)return;
  const cl=db.clientes.find(x=>x.id===c.clienteId)||{};
  Object.assign(draft,{motorista:c.motorista||'',modelo:c.modelo||'',cor:c.cor||'',cliente:cl.nome||'',tel:cl.tel||''});
  ['motorista','modelo','cor','cliente','tel'].forEach(k=>{const el=document.getElementById(k);if(el)el.value=draft[k]});
  toast('Caminhão encontrado · dados preenchidos');
}
function addItem(){
  const desc=(draft.desc||'').trim();
  if(!desc)return toast('Informe o item');
  cart.push({desc,qtd:Number(draft.qtd)||1,preco:num(draft.preco)});
  Object.assign(draft,{desc:'',qtd:'1',preco:''});
  render();
}
function salvarAtend(){
  const placa=norm(draft.placa);
  if(placa.length<7){toast('Informe a placa do caminhão');return null}
  if(!cart.length){toast('Adicione ao menos um item');return null}
  const nome=(draft.cliente||'').trim(),tel=(draft.tel||'').trim();
  let cl=nome?db.clientes.find(x=>x.nome.toLowerCase()===nome.toLowerCase()):null;
  if(nome&&!cl){cl={id:uid(),nome,tel};db.clientes.push(cl)}
  else if(cl&&tel)cl.tel=tel;
  let car=db.caminhoes.find(x=>x.placa===placa);
  if(!car){car={id:uid(),placa};db.caminhoes.push(car)}
  Object.assign(car,{motorista:(draft.motorista||'').trim(),modelo:(draft.modelo||'').trim(),cor:(draft.cor||'').trim(),clienteId:cl?cl.id:(car.clienteId||null)});
  return {car,cl};
}
function criar(tipo,forma){
  const s=salvarAtend();if(!s)return;
  const itens=cart.map(i=>({...i}));
  const k={orc:'orcs',os:'oss',venda:'vendas'}[tipo];
  const d={id:uid(),ts:Date.now(),num:numero({orc:'ORC',os:'OS',venda:'VD'}[tipo]),data:today(),carId:s.car.id,clienteId:s.cl?s.cl.id:(s.car.clienteId||null),itens,total:totalCart(),status:{orc:'pendente',os:'aberta',venda:'paga'}[tipo],forma:forma||null};
  db[k].push(d);
  if(tipo==='venda')caixaAdd('entrada',d.total,forma,'Venda '+d.num);
  save();cart=[];draft={};tab='ordens';render();
  modal(`<h3>${{orc:'Orçamento pronto',os:'OS aberta',venda:'Venda registrada'}[tipo]}</h3><p class="mut">${d.num} · ${R(d.total)}</p>
  <div class="acts"><button class="wa" data-a="wa" data-id="${d.id}" data-k="${k}">Enviar no WhatsApp</button><button class="ghost" data-a="fechar">Depois</button></div>`);
}
function aprovar(id){
  const o=db.orcs.find(x=>x.id===id);if(!o)return;
  o.status='aprovado';
  db.oss.push({...o,id:uid(),ts:Date.now(),num:numero('OS'),status:'aberta',origem:o.num,data:today(),forma:null});
  save();toast('OS criada a partir do orçamento');render();
}
function receber(id,f){
  const o=db.oss.find(x=>x.id===id);if(!o)return;
  o.status='concluida';o.forma=f;
  caixaAdd('entrada',o.total,f,'OS '+o.num);
  save();fechar();toast('Recebido no '+(FORMAS[f]||''));render();
}

/* ---------- Ordens ---------- */
function vOrdens(){
  const todos=[...db.orcs.map(d=>[d,'orcs']),...db.oss.map(d=>[d,'oss']),...db.vendas.map(d=>[d,'vendas'])].sort((a,b)=>(b[0].ts||0)-(a[0].ts||0));
  return `<h2>Ordens e orçamentos</h2><div class="card">${todos.map(([d,k])=>linha(d,k)).join('')||'<p class="mut">Nenhum registro ainda. Faça um atendimento para começar.</p>'}</div>`;
}
function wa(k,id){
  const d=db[k].find(x=>x.id===id);if(!d)return;
  const car=carDe(d),cli=cliDe(d);
  const cab={orcs:'Orçamento',oss:'Ordem de serviço',vendas:'Recibo'}[k];
  const lin=d.itens.map(i=>`• ${i.desc} (${i.qtd}x): ${R(i.qtd*i.preco)}`).join('\n');
  const txt=`*Estofaria Amorelli* · Tapeçaria e acessórios\n${cab} ${d.num}\nCaminhão: ${car.placa||''}${car.modelo?' · '+car.modelo:''}${car.cor?' · '+car.cor:''}\n\n${lin}\n\n*Total: ${R(d.total)}*${k==='orcs'?'\n\nPara aprovar, responda SIM.':''}`;
  const tel=(cli.tel||'').replace(/\D/g,'');
  window.open(`https://wa.me/${tel?'55'+tel.replace(/^55/,''):''}?text=${encodeURIComponent(txt)}`,'_blank');
}
function ver(id,k){
  const d=db[k].find(x=>x.id===id);if(!d)return;
  const car=carDe(d),cli=cliDe(d);
  const cab={orcs:'Orçamento',oss:'Ordem de serviço',vendas:'Recibo'}[k];
  modal(`<div id="print"><h3>Estofaria Amorelli</h3><p class="mut">Tapeçaria e acessórios</p>
  <p><b>${cab} ${esc(d.num)}</b> · ${d.data}</p>
  <p>Placa <b>${esc(car.placa||'')}</b> · ${esc(car.modelo||'')} · ${esc(car.cor||'')}<br>Motorista: ${esc(car.motorista||'—')}<br>Cliente: ${esc(cli.nome||'—')}</p>
  <table>${d.itens.map(i=>`<tr><td>${esc(i.desc)}</td><td>${i.qtd}x</td><td style="text-align:right">${R(i.qtd*i.preco)}</td></tr>`).join('')}</table>
  <p style="text-align:right"><b>Total: ${R(d.total)}</b>${d.forma?'<br>Pagamento: '+(FORMAS[d.forma]||''):''}</p></div>
  <div class="acts"><button data-a="imprimir">Imprimir</button><button class="ghost" data-a="fechar">Fechar</button></div>`);
}

/* ---------- Caixa ---------- */
function vCaixa(){
  const hj=today(),mes=hj.slice(0,7);
  const ok=m=>periodo==='hoje'?m.data===hj:periodo==='mes'?m.data.startsWith(mes):true;
  const movs=db.caixa.filter(ok).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const soma=(t,f)=>movs.filter(m=>m.tipo===t&&(!f||m.forma===f)).reduce((a,m)=>a+m.valor,0);
  const E=soma('entrada'),S=soma('saida');
  const per=[['hoje','Hoje'],['mes','Mês'],['tudo','Tudo']].map(([k,l])=>`<button class="sm ${periodo===k?'':'ghost'}" data-a="periodo" data-id="${k}">${l}</button>`).join(' ');
  return `<h2>Caixa</h2><div class="acts" style="margin:0 0 12px">${per}</div>
  <div class="grid">
    <div class="card kpi"><span>Entradas</span><b class="ok">${R(E)}</b></div>
    <div class="card kpi"><span>Saídas</span><b class="bad">${R(S)}</b></div>
    <div class="card kpi"><span>Saldo</span><b>${R(E-S)}</b></div></div>
  <div class="card"><h3>Recebido por forma de pagamento</h3><div class="grid" style="margin:0">${Object.entries(FORMAS).map(([k,l])=>`<div class="kpi"><span>${l}</span><b>${R(soma('entrada',k))}</b></div>`).join('')}</div></div>
  <div class="card"><h3>Lançar movimentação</h3>
    <div class="g">
      <div><label>Tipo</label><select id="mtipo"><option value="saida">Saída</option><option value="entrada">Entrada</option></select></div>
      <div><label>Valor</label><input id="mvalor" inputmode="decimal" placeholder="0,00"></div>
      <div style="grid-column:1/-1"><label>Descrição</label><input id="mdesc" placeholder="Ex.: Compra de espuma"></div>
      <div><label>Forma</label><select id="mforma"><option value="">—</option>${Object.entries(FORMAS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
    </div>
    <div class="acts"><button data-a="mov">Registrar</button></div></div>
  <div class="card"><h3>Movimentações</h3>${movs.map(m=>`<div class="item"><div><b class="${m.tipo==='entrada'?'ok':'bad'}">${m.tipo==='entrada'?'+':'−'} ${R(m.valor)}</b> ${esc(m.desc)}<div class="mut">${m.data}${m.forma?' · '+(FORMAS[m.forma]||''):''}</div></div><button class="sm danger" data-a="del" data-id="${m.id}" data-k="caixa">Excluir</button></div>`).join('')||'<p class="mut">Sem movimentações no período.</p>'}</div>`;
}
function mov(){
  const v=num($('#mvalor').value);
  if(!v)return toast('Informe o valor');
  caixaAdd($('#mtipo').value,v,$('#mforma').value,$('#mdesc').value.trim()||'Movimentação');
  save();render();toast('Registrado');
}

/* ---------- Cadastros ---------- */
function vCad(){
  return `<h2>Cadastros</h2>
  <div class="card"><h3>Produtos e serviços</h3>
    <div class="g"><div><label>Nome</label><input id="pnome" placeholder="Ex.: Troca de espuma"></div><div><label>Preço</label><input id="ppreco" inputmode="decimal" placeholder="0,00"></div></div>
    <div class="acts"><button data-a="addProd">Cadastrar</button></div>
    <div style="margin-top:8px">${lista(db.produtos,'produtos',p=>`<b>${esc(p.nome)}</b><div class="mut">${R(p.preco)}</div>`)}</div></div>
  <div class="card"><h3>Clientes</h3>
    <div class="g"><div><label>Nome ou empresa</label><input id="cnome"></div><div><label>WhatsApp</label><input id="ctel" inputmode="tel"></div></div>
    <div class="acts"><button data-a="addCli">Cadastrar</button></div>
    <div style="margin-top:8px">${lista(db.clientes,'clientes',c=>`<b>${esc(c.nome)}</b><div class="mut">${esc(c.tel||'')}</div>`)}</div></div>
  <div class="card"><h3>Caminhões</h3><p class="mut">Cadastrados automaticamente no atendimento.</p>
    ${lista(db.caminhoes,'caminhoes',c=>{const cl=db.clientes.find(x=>x.id===c.clienteId)||{};return `<b>${esc(c.placa)}</b> · ${esc(c.modelo||'')} · ${esc(c.cor||'')}<div class="mut">${esc(c.motorista||'')}${cl.nome?' · '+esc(cl.nome):''}</div>`})}</div>`;
}
function addProd(){
  const n=$('#pnome').value.trim();
  if(!n)return toast('Informe o nome');
  db.produtos.push({id:uid(),nome:n,preco:num($('#ppreco').value)});
  save();render();toast('Produto cadastrado');
}
function addCli(){
  const n=$('#cnome').value.trim();
  if(!n)return toast('Informe o nome');
  db.clientes.push({id:uid(),nome:n,tel:$('#ctel').value.trim()});
  save();render();toast('Cliente cadastrado');
}

/* ---------- Backup ---------- */
function backup(){modal(`<h3>Backup dos dados</h3><p class="mut">Exporte para guardar ou levar os dados a outro aparelho, e importe lá.</p><div class="acts"><button data-a="exp">Exportar backup</button><button class="ghost" data-a="imp">Importar backup</button><button class="danger" data-a="sair">Sair desta conta</button></div><input type="file" id="arq" accept="application/json" hidden>`)}
function exportar(){const b=new Blob([JSON.stringify(db)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='amorelli-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup exportado')}
function importar(){const f=$('#arq');f.onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.orcs))throw new Error();db=d;save();fechar();render();toast('Dados importados')}catch(err){toast('Arquivo inválido')}};r.readAsText(file)};f.click()}

/* ---------- Nuvem (Supabase) ---------- */
const setSt=t=>{const e=$('#st');if(e)e.textContent=t};
const hora=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function vLogin(){return `<section class="login"><h2>Entrar</h2><div class="card"><p class="mut">Use o e-mail e a senha da loja.</p><label>E-mail</label><input id="lemail" type="email" autocomplete="username"><label>Senha</label><input id="lsenha" type="password" autocomplete="current-password"><div class="acts"><button data-a="login">Entrar</button></div><p class="mut" id="lerr"></p></div></section>`}
async function autenticar(corpo,tipo){
  const r=await fetch(`${SB.url}/auth/v1/token?grant_type=${tipo}`,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
  if(!r.ok)return false;
  sess=await r.json();guardarSess();return true;
}
async function entrarTela(){
  const ok=await autenticar({email:$('#lemail').value.trim(),password:$('#lsenha').value},'password');
  if(!ok){$('#lerr').textContent='E-mail ou senha incorretos.';return}
  await baixar();render();iniciarSync();
}
async function api(path,opt={}){
  const ir=()=>fetch(SB.url+path,{method:opt.method||'GET',headers:{apikey:SB.key,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json',...(opt.headers||{})},body:opt.body?JSON.stringify(opt.body):undefined});
  let r=await ir();
  if(r.status===401&&sess?.refresh_token&&await autenticar({refresh_token:sess.refresh_token},'refresh_token'))r=await ir();
  if(r.status===401){sess=null;guardarSess();render();throw new Error('sessao')}
  if(!r.ok)throw new Error(String(r.status));
  return r;
}
function agendarEnvio(){if(!SYNC_ON||!sess)return;clearTimeout(pushT);pushT=setTimeout(enviar,700)}
async function enviar(){
  if(!SYNC_ON||!sess)return;
  setSt('Sincronizando…');
  try{await api('/rest/v1/loja',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:[{id:'amorelli',dados:db,atualizado_em:db.ts}]});setSt('Sincronizado às '+hora())}
  catch(e){if(e.message!=='sessao')setSt('Sem conexão · salvo no aparelho')}
}
async function baixar(){
  if(!SYNC_ON||!sess)return;
  setSt('Sincronizando…');
  try{
    const row=(await (await api('/rest/v1/loja?id=eq.amorelli&select=dados,atualizado_em')).json())[0];
    if(!row){await enviar();return}
    if(row.atualizado_em>(db.ts||0)){db=row.dados;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){};render()}
    else if((db.ts||0)>row.atualizado_em)await enviar();
    setSt('Sincronizado às '+hora());
  }catch(e){if(e.message!=='sessao')setSt('Sem conexão · salvo no aparelho')}
}
let ouvindo=false;
function iniciarSync(){
  if(ouvindo)return;ouvindo=true;
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sess)baixar()});
  window.addEventListener('online',()=>{if(sess)baixar()});
  baixar();
}
function sair(){sess=null;guardarSess();clearTimeout(pushT);fechar();render()}
function iniciar(){render();if(SYNC_ON&&sess)iniciarSync()}

/* ---------- Eventos ---------- */
const A={
  go:id=>{tab=id;scrollTo(0,0);render()},
  periodo:id=>{periodo=id;render()},
  add:()=>addItem(),
  rem:id=>{cart.splice(+id,1);render()},
  orc:()=>criar('orc'),
  os:()=>criar('os'),
  vender:()=>escolherForma('Forma de pagamento','vendaF',''),
  vendaF:(id,k,f)=>{fechar();criar('venda',f)},
  aprovar:id=>aprovar(id),
  concluir:id=>{const o=db.oss.find(x=>x.id===id);if(o)escolherForma(`Receber ${o.num} · ${R(o.total)}`,'receberF',id)},
  receberF:(id,k,f)=>receber(id,f),
  wa:(id,k)=>wa(k,id),
  ver:(id,k)=>ver(id,k),
  imprimir:()=>window.print(),
  fechar:()=>fechar(),
  del:(id,k)=>{db[k]=db[k].filter(x=>x.id!==id);save();render()},
  addProd:()=>addProd(),
  addCli:()=>addCli(),
  mov:()=>mov(),
  backup:()=>backup(),
  exp:()=>exportar(),
  imp:()=>importar(),
  login:()=>entrarTela(),
  sair:()=>sair()
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const fn=A[b.dataset.a];
  if(fn)fn(b.dataset.id,b.dataset.k,b.dataset.f);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(!t.closest||!t.closest('#atend'))return;
  draft[t.id]=t.value;
  if(t.id==='placa')achar();
  if(t.id==='desc'){
    const p=db.produtos.find(x=>x.nome.toLowerCase()===t.value.trim().toLowerCase());
    if(p){draft.preco=String(p.preco).replace('.',',');const el=$('#preco');if(el)el.value=draft.preco}
  }
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')fechar()});
iniciar();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
</html>
